<svg viewBox="0 0 820 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" role="img">
<title>Modelo de fluxograma PRISMA com 4 etapas para a revisao de ET0</title>
<desc>Fluxograma com faixas Identification, Screening, Eligibility e Included, caixas com n = X e setas.</desc>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#333"/>
</marker>
</defs>
<rect x="0" y="0" width="820" height="660" fill="#ffffff"/>

<rect x="16" y="44" width="46" height="182" rx="4" fill="#2f6fb0"/>
<text x="39" y="135" fill="#fff" font-size="14.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 39 135)">Identification</text>

<rect x="16" y="242" width="46" height="80" rx="4" fill="#2f6fb0"/>
<text x="39" y="282" fill="#fff" font-size="14.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 39 282)">Screening</text>

<rect x="16" y="338" width="46" height="170" rx="4" fill="#2f6fb0"/>
<text x="39" y="423" fill="#fff" font-size="14.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 39 423)">Eligibility</text>

<rect x="16" y="524" width="46" height="80" rx="4" fill="#2f6fb0"/>
<text x="39" y="564" fill="#fff" font-size="14.5" font-weight="bold" text-anchor="middle" transform="rotate(-90 39 564)">Included</text>

<rect x="120" y="52" width="300" height="166" rx="3" fill="#eaf2fb" stroke="#333" stroke-width="1.3"/>
<text x="132" y="74" font-size="13" font-weight="bold">Records identified from databases:</text>
<text x="140" y="96" font-size="12.5">Web of Science (n = X)</text>
<text x="140" y="116" font-size="12.5">Scopus (n = X)</text>
<text x="140" y="136" font-size="12.5">OpenAlex (n = X)</text>
<text x="140" y="156" font-size="12.5">IEEE Xplore (n = X)</text>
<text x="132" y="182" font-size="12.5" font-weight="bold">Total records identified (n = X)</text>

<rect x="470" y="52" width="320" height="166" rx="3" fill="#eaf2fb" stroke="#333" stroke-width="1.3"/>
<text x="482" y="74" font-size="13" font-weight="bold">Records removed before screening:</text>
<text x="490" y="95" font-size="12">Duplicate records removed (n = X)</text>
<text x="490" y="115" font-size="12">Non-article types removed - reviews,</text>
<text x="490" y="131" font-size="12">proceedings, book chapters,</text>
<text x="490" y="147" font-size="12">editorials (n = X)</text>
<text x="490" y="167" font-size="12">Preprints / repositories (n = X)</text>
<text x="490" y="187" font-size="12">Off-scope (medical) journals (n = X)</text>

<rect x="120" y="250" width="300" height="60" rx="3" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="132" y="275" font-size="13" font-weight="bold">Records screened</text>
<text x="132" y="294" font-size="12.5">(title / abstract) (n = X)</text>

<rect x="470" y="250" width="320" height="60" rx="3" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="482" y="284" font-size="12.5">Records excluded (n = X)</text>

<rect x="120" y="360" width="300" height="60" rx="3" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="132" y="385" font-size="13" font-weight="bold">Full-text reports assessed</text>
<text x="132" y="404" font-size="13" font-weight="bold">for eligibility (n = X)</text>

<rect x="470" y="338" width="320" height="170" rx="3" fill="#fff" stroke="#333" stroke-width="1.3"/>
<text x="482" y="359" font-size="12.5" font-weight="bold">Reports excluded, with reasons:</text>
<text x="490" y="380" font-size="12">ET mentioned only incidentally,</text>
<text x="490" y="396" font-size="12">no tool / method focus (n = X)</text>
<text x="490" y="416" font-size="12">Unrelated domain sharing the</text>
<text x="490" y="432" font-size="12">'ET / ETo' token (n = X)</text>
<text x="490" y="452" font-size="12">Not in English (n = X)</text>
<text x="490" y="472" font-size="12">Full text unavailable (n = X)</text>

<rect x="120" y="532" width="300" height="60" rx="3" fill="#dceafc" stroke="#333" stroke-width="1.5"/>
<text x="132" y="557" font-size="13" font-weight="bold">Studies included in review</text>
<text x="132" y="577" font-size="13" font-weight="bold">(n = X)</text>

<line x1="270" y1="218" x2="270" y2="250" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="270" y1="310" x2="270" y2="360" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="270" y1="420" x2="270" y2="532" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="420" y1="135" x2="470" y2="135" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="420" y1="280" x2="470" y2="280" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
<line x1="420" y1="390" x2="470" y2="390" stroke="#333" stroke-width="1.3" marker-end="url(#ah)"/>
</svg>
